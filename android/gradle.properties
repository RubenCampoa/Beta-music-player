# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Only keep the R class for the current module
android.nonTransitiveRClass=true

# Enable build caching
org.gradle.caching=true

# Suppress AGP compileSdk 37 warning required by backdrop 2.0.0
android.suppressUnsupportedCompileSdk=37
